<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Kaffeine Rush AR</title>
<meta name="theme-color" content="#3a2a22">
<script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe-v1.5.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .bar{position:fixed;left:0;right:0;z-index:20;display:flex;justify-content:center;gap:8px;padding:12px 16px;pointer-events:none}
  .top{top:0;padding-top:calc(12px + env(safe-area-inset-top,0px))}
  .bottom{bottom:0;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));flex-wrap:wrap}
  .pill{pointer-events:auto;background:rgba(255,255,255,.92);color:#3a2a22;border:0;border-radius:999px;padding:10px 16px;font-size:.95rem;font-weight:600;text-decoration:none;box-shadow:0 2px 10px rgba(0,0,0,.25)}
  .pill.gold{background:#b98b4e;color:#fff}
  #hint{pointer-events:none;background:rgba(58,42,34,.85);color:#fff;border-radius:14px;padding:10px 14px;font-size:.95rem;text-align:center;max-width:320px}
  #hint.found{background:rgba(46,125,50,.85)}
  .mindar-ui-overlay .mindar-ui-scanning,.a-enter-vr,.a-enter-ar,.a-fullscreen{display:none!important}
</style>
</head>
<body>
<div class="bar top"><div id="hint">📷 Halakan kamera ke seluruh poster</div></div>
<div class="bar bottom">
  <button class="pill" id="mode">Poster di meja</button>
  <a class="pill gold" href="meja.html">Letak di lantai</a>
</div>

<script>
  // Pusing perlahan (darjah sesaat), tidak bergantung pada animation component
  AFRAME.registerComponent('spin',{schema:{speed:{default:20}},tick(t,dt){if(dt)this.el.object3D.rotation.y+=THREE.MathUtils.degToRad(this.data.speed)*dt/1000;}});
</script>
<a-scene mindar-image="imageTargetSrc: targets.mind?v=3; filterMinCF: 0.0001; filterBeta: 5; missTolerance: 10; warmupTolerance: 3; uiScanning: no; uiLoading: yes"
  color-space="sRGB" renderer="colorManagement: true; physicallyCorrectLights: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
  <a-assets><a-asset-item id="tin" src="produk.glb?v=3"></a-asset-item></a-assets>
  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  <a-entity light="type: ambient; intensity: 1.2"></a-entity>
  <a-entity light="type: directional; intensity: 1.6" position="0.5 1 1"></a-entity>
  <a-entity id="target" mindar-image-target="targetIndex: 0">
    <!-- 1 unit = lebar poster. QR di tengah (0.241, 0.025). Mod dinding: tin berdiri di depan QR -->
    <a-entity id="holder" position="0.241 -0.2 0.04">
      <a-entity spin="speed: 20">
        <a-gltf-model src="#tin" scale="3 3 3"></a-gltf-model>
      </a-entity>
    </a-entity>
  </a-entity>
</a-scene>

<script>
  const hint=document.getElementById('hint'), target=document.getElementById('target'), holder=document.getElementById('holder'), btn=document.getElementById('mode');
  target.addEventListener('targetFound',()=>{hint.textContent='✅ Tin Kaffeine Rush!';hint.classList.add('found');});
  target.addEventListener('targetLost',()=>{hint.textContent='📷 Halakan kamera ke seluruh poster';hint.classList.remove('found');});
  // Dua mod: poster tegak (skrin/dinding) atau poster rata (atas meja)
  let flat=false;
  btn.addEventListener('click',()=>{
    flat=!flat;
    if(flat){holder.setAttribute('rotation','90 0 0');holder.setAttribute('position','0.241 0.025 0');btn.textContent='Poster di dinding / skrin';}
    else{holder.setAttribute('rotation','0 0 0');holder.setAttribute('position','0.241 -0.2 0.04');btn.textContent='Poster di meja';}
  });
</script>
</body>
</html>
