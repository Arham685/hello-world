<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaffeine Rush – Lihat dalam AR</title>
<meta name="theme-color" content="#f7e3dc">
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
  :root{--bg:#fbf1ec;--ink:#3a2a22;--muted:#8a6f60;--gold:#b98b4e;--peach:#f4c7b8}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:linear-gradient(180deg,#fff7f3,var(--bg));color:var(--ink);display:flex;flex-direction:column}
  header{padding:18px 16px 6px;text-align:center}
  .brand{margin:0;font-size:1.5rem;letter-spacing:.12em;color:var(--gold);font-weight:600}
  header p{margin:6px 0 0;color:var(--muted);font-size:.95rem}
  model-viewer{flex:1;width:100%;min-height:62vh;background:transparent;--poster-color:transparent}
  .ar-btn{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:var(--gold);color:#fff;border:0;border-radius:999px;padding:16px 28px;font-size:1.1rem;font-weight:700;box-shadow:0 6px 18px rgba(120,80,40,.35);white-space:nowrap;animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{50%{transform:translateX(-50%) scale(1.05)}}
  @media (prefers-reduced-motion:reduce){.ar-btn{animation:none}}
  .help{padding:10px 16px 22px;font-size:.88rem;color:var(--muted);text-align:center}
  #no-ar{display:none;position:absolute;left:16px;right:16px;bottom:22px;background:#fff;border-radius:12px;padding:12px;text-align:center;font-size:.9rem;box-shadow:0 2px 10px rgba(0,0,0,.12)}
</style>
</head>
<body>
<header>
  <h1 class="brand">KAFFEINE RUSH</h1>
  <p>Brewed fresh. Tekan butang untuk letak tin di atas meja anda.</p>
</header>
<model-viewer id="mv" src="produk.glb" alt="Tin Kaffeine Rush dalam 3D"
  ar ar-modes="webxr scene-viewer quick-look" ar-scale="fixed" ar-placement="floor"
  camera-controls touch-action="pan-y" auto-rotate auto-rotate-delay="0" rotation-per-second="20deg"
  camera-orbit="0deg 80deg auto" interaction-prompt="none"
  shadow-intensity="1" shadow-softness="0.8" exposure="0.85" environment-image="neutral">
  <button slot="ar-button" class="ar-btn">📷 Buka kamera &amp; lihat 3D</button>
  <div id="no-ar">Telefon ini tidak sokong AR. Anda masih boleh pusing tin 3D di atas.</div>
</model-viewer>
<div class="help">Android: Chrome. iPhone: Safari. Tiada app perlu dipasang.</div>
<script>
  const mv=document.getElementById('mv');
  mv.addEventListener('load',()=>{ if(!mv.canActivateAR) document.getElementById('no-ar').style.display='block'; });
</script>
</body>
</html>
